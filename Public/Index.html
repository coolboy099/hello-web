<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Mini Aternos</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #111827;
            color: white;
            margin: 0;
            padding: 30px;
        }

        h1 {
            margin-bottom: 20px;
        }

        input {
            padding: 10px;
            border-radius: 6px;
            border: none;
            margin-right: 5px;
        }

        button {
            padding: 10px 15px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            margin: 3px;
        }

        .create {
            background: #22c55e;
            color: white;
        }

        .start {
            background: #3b82f6;
            color: white;
        }

        .stop {
            background: #ef4444;
            color: white;
        }

        .server {
            background: #1f2937;
            padding: 15px;
            margin-top: 15px;
            border-radius: 10px;
        }

        .console {
            background: black;
            color: #00ff00;
            padding: 15px;
            margin-top: 10px;
            height: 250px;
            overflow-y: auto;
            white-space: pre-wrap;
            font-family: monospace;
        }
    </style>
</head>

<body>

<h1>⛏️ Mini Aternos</h1>

<input id="serverName" placeholder="Server name">

<button class="create" onclick="createServer()">
    Create Server
</button>

<div id="servers"></div>

<script>

async function createServer() {

    const name = document.getElementById("serverName").value;

    if (!name) {
        alert("Server name enter karo");
        return;
    }

    const response = await fetch("/api/create", {
        method: "POST",
        headers: {
            "Content-Type": "application/json"
        },
        body: JSON.stringify({
            name
        })
    });

    const data = await response.json();

    if (!response.ok) {
        alert(data.error);
        return;
    }

    document.getElementById("serverName").value = "";

    loadServers();
}


async function loadServers() {

    const response = await fetch("/api/servers");

    const servers = await response.json();

    const container = document.getElementById("servers");

    container.innerHTML = "";

    servers.forEach(server => {

        const div = document.createElement("div");

        div.className = "server";

        div.innerHTML = `
            <h2>🟢 ${server.name}</h2>

            <p>
                Status:
                ${server.running ? "🟢 Running" : "🔴 Offline"}
            </p>

            <button class="start"
                onclick="startServer('${server.name}')">
                ▶ Start
            </button>

            <button class="stop"
                onclick="stopServer('${server.name}')">
                ⏹ Stop
            </button>

            <div class="console"
                 id="console-${server.name}">
                Console waiting...
            </div>
        `;

        container.appendChild(div);
    });
}


async function startServer(name) {

    const response = await fetch(
        `/api/start/${name}`,
        {
            method: "POST"
        }
    );

    const data = await response.json();

    if (!response.ok) {
        alert(data.error);
        return;
    }

    loadServers();
}


async function stopServer(name) {

    const response = await fetch(
        `/api/stop/${name}`,
        {
            method: "POST"
        }
    );

    const data = await response.json();

    if (!response.ok) {
        alert(data.error);
        return;
    }

    loadServers();
}


async function loadLogs() {

    const response = await fetch("/api/servers");

    const servers = await response.json();

    for (const server of servers) {

        if (!server.running) continue;

        const response = await fetch(
            `/api/logs/${server.name}`
        );

        const data = await response.json();

        const consoleBox =
            document.getElementById(
                `console-${server.name}`
            );

        if (consoleBox) {

            consoleBox.textContent =
                data.logs.join("");

            consoleBox.scrollTop =
                consoleBox.scrollHeight;
        }
    }
}


loadServers();

setInterval(() => {
    loadServers();
    loadLogs();
}, 3000);

</script>

</body>
</html>
